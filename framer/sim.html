<!doctype html>
<!-- opticalMargin/framer/sim.html — Framer-less simulator for the OpticalMargin code component.
     Renders the REAL src/framer/OpticalMargin.tsx (transpiled to OpticalMargin.sim.mjs) in a plain
     browser, with the "framer" import mapped to a local shim and React from esm.sh. This proves
     the component's runtime logic (rendering, applyOpticalMargin, ResizeObserver re-apply) outside
     Framer.
     Build step: npx esbuild src/framer/OpticalMargin.tsx --loader:.tsx=tsx --format=esm
       --jsx=automatic --jsx-import-source=react --outfile=framer/OpticalMargin.sim.mjs -->
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>OpticalMargin — Framer component simulator</title>
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&display=swap" rel="stylesheet" />
	<style>
		body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f1ea; color: #111111; padding: 4rem 6vw; }
		#root { width: 100%; max-width: 22ch; outline: 1px dashed rgba(0,0,0,0.15); }
		.note { position: fixed; bottom: 1rem; left: 0; right: 0; text-align: center; font: 0.8rem system-ui; opacity: 0.5; }
	</style>
	<script type="importmap">
	{
		"imports": {
			"react": "https://esm.sh/react@18",
			"react/jsx-runtime": "https://esm.sh/react@18/jsx-runtime",
			"react-dom/client": "https://esm.sh/react-dom@18/client",
			"framer": "./framer-shim.js"
		}
	}
	</script>
</head>
<body>
	<div id="root"></div>
	<p class="note">Simulating the Framer code component in a plain browser — the dashed box edge shows the margin the punctuation hangs into.</p>
	<script type="module">
		import React from "react"
		import { createRoot } from "react-dom/client"
		import OpticalMargin from "./OpticalMargin.sim.mjs"
		createRoot(document.getElementById("root")).render(
			React.createElement(OpticalMargin, {
				text: "“Typography is the craft of endowing human language with a durable visual form,” wrote Robert Bringhurst — and the margin is where that form breathes.",
				fontFamily: "Fraunces",
				fontSize: 40,
				color: "#111111",
				textAlign: "left",
				hangStart: true,
				hangEnd: true,
				threshold: 0.5,
				maxHangRatio: 0.9,
			})
		)
	</script>
</body>
</html>
